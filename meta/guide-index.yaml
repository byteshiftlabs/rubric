version: 1
entrypoints:
  - path: README.md
    title: Rubric
    kind: readme
    pack: task-workflows
    summary: Starting point for choosing the smallest useful guide bundle for a task.
    load_when:
      - a user is new to the repo
      - a host needs the top-level map before selecting guides
    avoid_when:
      - the exact guide set is already known
    tags: [entrypoint, routing, overview]
  - path: meta/CONSUMING.md
    title: Consuming This Repo
    kind: guide
    pack: task-workflows
    summary: Packaging-oriented entrypoint that explains how to use README.md with the metadata files under meta/.
    load_when:
      - a tool or packaging pipeline needs structured routing metadata
      - the consumer should start from README.md plus the meta folder
    avoid_when:
      - a human reader only needs the top-level overview in README.md
    tags: [entrypoint, routing, packaging, metadata]

guides:
  - path: core/shared-contract.md
    title: Shared Contract
    kind: guide
    pack: core-rules
    summary: Stable rules for correctness, safety, scope, verification, and repository policy.
    load_when: [baseline rules are needed for any task, shared behavior must stay invariant]
    avoid_when: [you only need task-specific steps and baseline rules are already loaded]
    tags: [core, policy, verification, safety]
  - path: core/memory-contract.md
    title: Memory Contract
    kind: guide
    pack: core-rules
    summary: Defines when memory is real, what should be stored, and how to separate memory scopes.
    load_when: [the host supports memory, the task involves remembered preferences or repo facts]
    avoid_when: [the host has no persistent memory support]
    tags: [core, memory, context]
  - path: development/api-design.md
    title: API Design
    kind: guide
    pack: task-workflows
    summary: Helps design APIs with clear contracts, compatibility, and maintainable boundaries.
    load_when: [designing interfaces, evaluating API shape, planning breaking changes]
    avoid_when: [debugging runtime failures]
    tags: [workflow, design, api]
  - path: development/code-review.md
    title: Code Review
    kind: guide
    pack: task-workflows
    summary: Review process for normal quality, correctness, maintainability, and targeted cleanup.
    load_when: [reviewing code quality in normal development]
    avoid_when: [maximum-recall release audits are needed]
    tags: [workflow, review, quality]
  - path: development/commands.md
    title: Commands
    kind: guide
    pack: task-workflows
    summary: Guidance for reusable command workflows and command-driven host integrations.
    load_when: [designing command workflows or assistant command patterns]
    avoid_when: [the task is not command-oriented]
    tags: [workflow, commands, host]
  - path: development/context-management.md
    title: Context Management
    kind: guide
    pack: task-workflows
    summary: Helps manage session context, remembered information, and context boundaries.
    load_when: [context is large, memory decisions matter, or the host has persistence]
    avoid_when: [small self-contained tasks]
    tags: [workflow, context, memory]
  - path: development/data-structure-design.md
    title: Data Structure Design
    kind: guide
    pack: task-workflows
    summary: Helps choose and shape data structures for correctness and maintainability.
    load_when: [designing schemas, object models, or data layout]
    avoid_when: [pure documentation or release workflow tasks]
    tags: [workflow, design, data]
  - path: development/debugging.md
    title: Debugging
    kind: guide
    pack: task-workflows
    summary: Structured process for reproducing issues, finding root cause, and applying fixes.
    load_when: [tracing bugs, regressions, environment differences, or runtime errors]
    avoid_when: [the goal is refactoring without behavior change]
    tags: [workflow, debugging, root-cause]
  - path: development/error-handling.md
    title: Error Handling
    kind: guide
    pack: task-workflows
    summary: Guidance for designing or reviewing clear and reliable error paths.
    load_when: [improving exceptions, failures, recovery paths, or validation behavior]
    avoid_when: [the task is unrelated to failure handling]
    tags: [workflow, reliability, errors]
  - path: development/repo-integrity-audit.md
    title: Repo Integrity Audit
    kind: guide
    pack: task-workflows
    summary: Checklist-driven audit for repo integrity and quality, usable as a repo audit or as a gate while drafting a new repo. Also the release gate.
    load_when: [release readiness, repo audit work, drafting a new repo, or maximum coverage is required]
    avoid_when: [normal code review is enough]
    tags: [workflow, audit, release, exhaustive]
  - path: development/fix-and-recheck.prompt.md
    title: Fix And Recheck
    kind: prompt
    pack: task-workflows
    summary: Prompt wrapper for fixing recorded findings and rechecking the result.
    load_when: [working from an existing findings file or audit output]
    avoid_when: [there is no findings list to drive the work]
    tags: [workflow, prompt, remediation]
  - path: development/git-workflow.md
    title: Git Workflow
    kind: guide
    pack: task-workflows
    summary: Guidance for branches, commits, PR flow, and release hygiene.
    load_when: [the task involves version control workflow or PR hygiene]
    avoid_when: [no git or release workflow is involved]
    tags: [workflow, git, release]
  - path: development/hooks.md
    title: Hooks
    kind: guide
    pack: task-workflows
    summary: Guidance for designing or reviewing automated hooks and feedback loops.
    load_when: [working on pre-commit, CI, or automated assistant hooks]
    avoid_when: [the task is unrelated to automation hooks]
    tags: [workflow, hooks, automation]
  - path: development/host-integration.md
    title: Host Integration
    kind: guide
    pack: task-workflows
    summary: Covers assistant host setup, runtime support checks, and integration boundaries.
    load_when: [configuring the assistant host, runtime, or support checks]
    avoid_when: [the task is purely local coding inside an already-working host]
    tags: [workflow, host, integration]
  - path: development/incremental-development.md
    title: Incremental Development
    kind: guide
    pack: task-workflows
    summary: Breaks implementation into small safe steps with verification between steps.
    load_when: [building features iteratively or reducing change risk]
    avoid_when: [a one-shot review or documentation task]
    tags: [workflow, implementation, incremental]
  - path: development/model-adapters.md
    title: Model Adapters
    kind: guide
    pack: task-workflows
    summary: Describes how prompt structure should vary by model family without changing task rules.
    load_when: [the same task prompt must be tuned for GPT, Claude, Gemini, Llama, Mistral, Grok, or reasoning models]
    avoid_when: [one model family is used and no adapter changes are needed]
    tags: [routing, adapter, model-family]
  - path: development/performance.md
    title: Performance
    kind: guide
    pack: task-workflows
    summary: Guidance for identifying and improving inefficient code paths and scaling issues.
    load_when: [performance is a primary goal or bottlenecks need review]
    avoid_when: [the task does not touch performance]
    tags: [workflow, performance, optimization]
  - path: development/public-release-audit.prompt.md
    title: Public Release Audit
    kind: prompt
    pack: task-workflows
    summary: Prompt wrapper for public release audits and final readiness checks.
    load_when: [auditing a release candidate or public artifact]
    avoid_when: [the task is not release-facing]
    tags: [workflow, prompt, release]
  - path: development/refactoring.md
    title: Refactoring
    kind: guide
    pack: task-workflows
    summary: Guidance for restructuring code while preserving behavior.
    load_when: [the code needs cleanup or simplification without changing outputs]
    avoid_when: [the primary goal is bug fixing]
    tags: [workflow, refactoring, structure]
  - path: development/scope-control.md
    title: Scope Control
    kind: guide
    pack: task-workflows
    summary: Keeps work bounded and prevents opportunistic expansion.
    load_when: [feature creep or cleanup creep is a risk]
    avoid_when: [the task is already tightly bounded]
    tags: [workflow, scope, control]
  - path: development/task-decomposition.md
    title: Task Decomposition
    kind: guide
    pack: task-workflows
    summary: Breaks multi-stage work into clear subproblems and execution order.
    load_when: [the task is genuinely multi-step or cross-cutting]
    avoid_when: [the task is simple and direct]
    tags: [workflow, planning, decomposition]
  - path: development/test-generation.md
    title: Test Generation
    kind: guide
    pack: task-workflows
    summary: Guidance for creating, improving, and validating tests.
    load_when: [generating tests, expanding coverage, or tightening regression checks]
    avoid_when: [the task is unrelated to tests]
    tags: [workflow, tests, verification]
  - path: development/tool-extension.md
    title: Tool Extension
    kind: guide
    pack: task-workflows
    summary: Covers external tools, browser automation, notebooks, and CI-style extensions.
    load_when: [adding external integrations or extended tool capabilities]
    avoid_when: [no external tooling changes are involved]
    tags: [workflow, tools, extension]

  - path: setup/architecture.md
    title: Architecture
    kind: guide
    pack: task-workflows
    summary: Guidance for project architecture review and structural design work.
    load_when: [reviewing system structure, module boundaries, or architecture choices]
    avoid_when: [small isolated implementation tasks]
    tags: [setup, architecture, design]
  - path: setup/dev-principles.md
    title: Development Principles
    kind: guide
    pack: task-workflows
    summary: General development principles for shaping project setup and implementation choices.
    load_when: [setting project norms or bootstrap guidance]
    avoid_when: [a more specific task guide already covers the work]
    tags: [setup, principles, standards]
  - path: setup/documentation.md
    title: Documentation
    kind: guide
    pack: task-workflows
    summary: Template and guidance for writing thorough factual documentation.
    load_when: [writing READMEs, module docs, or explanatory documentation]
    avoid_when: [documentation is not part of the task]
    tags: [setup, docs, writing]
  - path: setup/prose-style.md
    title: Prose Style
    kind: guide
    pack: task-workflows
    summary: Catalogue of stylistic tropes that mark prose as machine-written, with a grep set for the mechanical ones.
    load_when: [writing or editing any prose deliverable, reviewing documentation for style, prose reads as AI-generated]
    avoid_when: [the task produces only code and no prose]
    tags: [setup, docs, writing, style, review]
  - path: setup/reproducibility.md
    title: Reproducibility
    kind: guide
    pack: task-workflows
    summary: Guidance for making workflows and outputs reproducible.
    load_when: [reproducibility, reruns, or environment consistency matter]
    avoid_when: [the task is purely exploratory and no repeatability requirement exists]
    tags: [setup, reproducibility, environment]

# Runnable tooling, not retrievable guide content. get_guide() only reads
# .md files, so entries here are reference-only and are not picked up by
# select_guides() (which reads only entrypoints and guides above).
tools:
  - path: rubric_mcp.py
    title: Rubric MCP Server
    kind: server
    summary: Runs this repo as an MCP server with four tools — get_index, select_guides, get_guide, get_shared_contract.
    run: python3 rubric_mcp.py
    install: pip install .
    tags: [mcp, server, tooling]
version: 1
repo: rubric
packaging_intent:
  selective_loading: true
  default_behavior: never-load-entire-repo
  description: >-
    Package this repository as small, task-oriented assets. Preserve routing and
    guide selection. Do not merge all guides into one monolithic skill unless a
    consumer explicitly asks for a full archive.
  primary_entrypoints:
    - README.md
    - meta/CONSUMING.md
    - meta/asset-manifest.yaml
    - meta/guide-index.yaml
  preserve_separation:
    - shared-rules
    - task-workflows
assets:
  - id: core-rules
    label: Core Rules
    purpose: Stable operating rules and memory policy.
    load_when:
      - every task needs baseline constraints
      - memory behavior must stay consistent
    avoid_when:
      - used alone for a task that also needs a workflow guide
    files:
      - core/shared-contract.md
      - core/memory-contract.md

  - id: task-workflows
    label: Task Workflows
    purpose: Task-specific methods for coding, review, debugging, scope, and setup work.
    load_when:
      - the task has a clear primary workflow such as debugging or code review
      - the user needs step-by-step task guidance
    avoid_when:
      - the host only needs a routing entrypoint and will fetch guides later
    files:
      - development/api-design.md
      - development/code-review.md
      - development/commands.md
      - development/context-management.md
      - development/data-structure-design.md
      - development/debugging.md
      - development/error-handling.md
      - development/fix-and-recheck.prompt.md
      - development/git-workflow.md
      - development/hooks.md
      - development/host-integration.md
      - development/incremental-development.md
      - development/model-adapters.md
      - development/performance.md
      - development/public-release-audit.prompt.md
      - development/refactoring.md
      - development/repo-integrity-audit.md
      - development/scope-control.md
      - development/task-decomposition.md
      - development/test-generation.md
      - development/tool-extension.md
      - setup/architecture.md
      - setup/dev-principles.md
      - setup/documentation.md
      - setup/prose-style.md
      - setup/reproducibility.md

  - id: mcp-server
    label: MCP Server
    purpose: Runs this repo as an MCP server so a host can call get_index, select_guides, get_guide, and get_shared_contract directly instead of reading files by hand.
    load_when:
      - the host connects over MCP instead of reading files directly
    avoid_when:
      - the consumer reads guide files directly and has no MCP client
    files:
      - rubric_mcp.py
      - pyproject.toml

packaging_rules:
  - Start from the routing entrypoints, not from bulk ingestion.
  - Prefer packaging one asset per consumer-facing use case.
  - Preserve original file paths in metadata so the router can point back to source files.
  - Keep shared contract files separate from task workflows when exporting.

suggested_exports:
  - target: claude-skill
    recommendation: Export core-rules plus one selected workflow.
  - target: ide-rules
    recommendation: Export core-rules and the smallest relevant workflow subset.
  - target: rag-or-search
    recommendation: Index all assets, but retrieve by pack and task tags rather than loading the whole corpus.
  - target: mcp
    recommendation: Expose the guide index and asset manifest as lookup metadata before serving file contents.